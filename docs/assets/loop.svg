<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d">
  <title id="t">The brain-kit session loop</title>
  <desc id="d">Every session reads BRAIN.md first, then the crew works: planner, builder, test-writer, then an independent qa and reviewer that can send the work back to the builder. The session ends by writing BRAIN.md, so the next session starts warm.</desc>
  <style>
    :root { --bg:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#cbd5e1; --card:#f8fafc;
            --brain:#7c3aed; --brain-soft:#ede9fe; --gate:#dc2626; --gate-soft:#fee2e2;
            --ok:#059669; --ok-soft:#d1fae5; --dot:#7c3aed; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --ink:#e6edf3; --mute:#8b949e; --line:#30363d; --card:#161b22;
              --brain:#a78bfa; --brain-soft:#2e1f5e; --gate:#f87171; --gate-soft:#3f1d1d;
              --ok:#34d399; --ok-soft:#0f3b2e; --dot:#c4b5fd; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .mute { fill: var(--mute); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .brain { fill: var(--brain-soft); stroke: var(--brain); stroke-width: 2; }
    .gate { fill: var(--gate-soft); stroke: var(--gate); stroke-width: 2; }
    .ok { fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2; }
    .wire { fill: none; stroke: var(--line); stroke-width: 2; }
    .loop { fill: none; stroke: var(--brain); stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
    .back { fill: none; stroke: var(--gate); stroke-width: 2; stroke-dasharray: 5 5; animation: flow 1s linear infinite reverse; }
    .arrow { fill: var(--line); }
    .arrow-b { fill: var(--brain); }
    .arrow-g { fill: var(--gate); }
    .dot { fill: var(--dot); }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .pulse2 { animation-delay: 1.2s; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .loop, .back, .pulse { animation: none; } .dot { display: none; } }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="440" rx="16"/>

  <!-- travelling dot (drawn first, so it slides BEHIND the cards and shows on the wires) -->
  <circle class="dot" r="6">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"
      path="M135 88 H765 M765 88 H888 V400 H12 V88 H135"/>
  </circle>

  <!-- 1 READ -->
  <rect class="brain pulse" x="30" y="40" width="210" height="96" rx="14"/>
  <text x="50" y="72" font-size="13" font-weight="700" class="mute" style="fill:var(--brain)">STEP 1</text>
  <text x="50" y="98" font-size="20" font-weight="700">Read <tspan class="mono" font-size="18">BRAIN.md</tspan></text>
  <text x="50" y="121" font-size="13" class="mute">in full, before any work</text>

  <!-- 2 WORK -->
  <rect class="card" x="300" y="40" width="300" height="96" rx="14"/>
  <text x="320" y="72" font-size="13" font-weight="700" class="mute">STEP 2</text>
  <text x="320" y="98" font-size="20" font-weight="700">The crew works</text>
  <text x="320" y="121" font-size="13" class="mute">no agent grades its own homework</text>

  <!-- 3 WRITE -->
  <rect class="brain pulse pulse2" x="660" y="40" width="210" height="96" rx="14"/>
  <text x="680" y="72" font-size="13" font-weight="700" style="fill:var(--brain)">STEP 3</text>
  <text x="680" y="98" font-size="20" font-weight="700">Write <tspan class="mono" font-size="18">BRAIN.md</tspan></text>
  <text x="680" y="121" font-size="13" class="mute">gotchas · state · next step</text>

  <!-- top arrows -->
  <path class="wire" d="M240 88 H292"/>
  <path class="arrow" d="M300 88 l-10 -6 v12 z"/>
  <path class="wire" d="M600 88 H652"/>
  <path class="arrow" d="M660 88 l-10 -6 v12 z"/>

  <!-- connectors down to crew -->
  <path class="wire" d="M450 136 V168"/>
  <path class="wire" d="M95 168 H805"/>
  <path class="wire" d="M95 168 V196"/>
  <path class="wire" d="M805 168 V196"/>

  <!-- crew chips -->
  <g font-size="14" font-weight="600">
    <rect class="card" x="40"  y="196" width="110" height="46" rx="10"/>
    <text x="95"  y="224" text-anchor="middle">planner</text>

    <rect class="card" x="190" y="196" width="110" height="46" rx="10"/>
    <text x="245" y="224" text-anchor="middle">builder</text>

    <rect class="card" x="340" y="196" width="110" height="46" rx="10"/>
    <text x="395" y="224" text-anchor="middle">test-writer</text>

    <rect class="gate" x="490" y="196" width="110" height="46" rx="10"/>
    <text x="545" y="224" text-anchor="middle">qa</text>

    <rect class="gate" x="640" y="196" width="110" height="46" rx="10"/>
    <text x="695" y="224" text-anchor="middle">reviewer</text>

    <rect class="ok" x="780" y="196" width="90" height="46" rx="10"/>
    <text x="825" y="224" text-anchor="middle" style="fill:var(--ok)">done ✓</text>
  </g>
  <g>
    <path class="wire" d="M150 219 H182"/><path class="arrow" d="M190 219 l-9 -5 v10 z"/>
    <path class="wire" d="M300 219 H332"/><path class="arrow" d="M340 219 l-9 -5 v10 z"/>
    <path class="wire" d="M450 219 H482"/><path class="arrow" d="M490 219 l-9 -5 v10 z"/>
    <path class="wire" d="M600 219 H632"/><path class="arrow" d="M640 219 l-9 -5 v10 z"/>
    <path class="wire" d="M750 219 H772"/><path class="arrow" d="M780 219 l-9 -5 v10 z"/>
  </g>
  <text x="545" y="262" font-size="11.5" text-anchor="middle" class="mute">proves it RUNS</text>
  <text x="695" y="262" font-size="11.5" text-anchor="middle" class="mute">judges it GOOD</text>

  <!-- send-back arrow -->
  <path class="back" d="M620 242 V292 H245 V250"/>
  <path class="arrow-g" d="M245 242 l-6 10 h12 z"/>
  <text x="432" y="310" font-size="13" text-anchor="middle" style="fill:var(--gate)" font-weight="600">FAILED / REVISE → back to the builder, with the exact miss</text>

  <!-- the loop back -->
  <path id="ret" class="loop" d="M870 88 H888 V400 H12 V88 H22"/>
  <path class="arrow-b" d="M30 88 l-10 -6 v12 z"/>
  <text x="450" y="392" font-size="14" text-anchor="middle" font-weight="600" style="fill:var(--brain)">next session starts warm — the brain IS the handover</text>

</svg>
